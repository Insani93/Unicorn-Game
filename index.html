-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;align-items:center;justify-items:center}.counter-dot{min-width:42px;min-height:42px;font-size:32px;border:2px solid white;border-radius:15px;background:#fff1ba;box-shadow:0 3px 0 #eab56c}.counter-dot.found{background:#d5f7ca;box-shadow:0 3px 0 #a1d1a4}.large-item{font-size:96px;text-align:center;line-height:1.2}.bigletter{font-size:116px;color:#f45ca8;text-shadow:0 6px 0 #b664c5,0 9px 14px #9b6dd55e;text-align:center;font-weight:1000;line-height:1.1}.flash{border:3px solid #fff;background:linear-gradient(#eaffde,#f8ffea);border-radius:22px;padding:16px;text-align:center;color:#417c51;font-size:19px;font-weight:1000;margin:12px 0}.toast{position:absolute;z-index:30;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));background:#fffdf9;box-shadow:0 8px 20px #573b7e7d;border:3px solid #ebc4ff;color:#673a9a;border-radius:20px;padding:12px;text-align:center;font-weight:900;animation:pop .24s ease-out}.progressline{height:12px;background:#e9dcff;border-radius:99px;overflow:hidden}.progressline>div{background:linear-gradient(90deg,#a5e68d,#5ac783);height:100%;border-radius:99px;transition:width .2s}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sticker{background:#fff8fd;border:3px solid #ead6fc;border-radius:17px;text-align:center;padding:12px 5px;font-size:36px}.sticker.dim{filter:grayscale(1);opacity:.25}.smalltext{font-size:12px;display:block;color:#70518c;font-weight:900}.parent-option{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #e2c3f7;border-radius:14px;padding:13px;color:#5f3b9b;margin:9px 0;font-weight:900;text-align:left}.switch{width:46px;height:26px;border-radius:99px;background:#b8a3d1;position:relative;flex-shrink:0}.switch.on{background:#7dd4aa}.switch:after{content:"";position:absolute;top:4px;left:4px;background:white;width:18px;height:18px;border-radius:50%;transition:.2s}.switch.o </div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), root=$('#screen'),toastEl=$('#toast');
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const WORD_ID=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas','dua belas','tiga belas','empat belas','lima belas','enam belas','tujuh belas','delapan belas','sembilan belas','dua puluh'];
const ALPHA=[['A','Apple','🍎','apel'],['B','Ball','⚽','bola'],['C','Cat','🐱','kucing'],['D','Dog','🐶','anjing'],['E','Elephant','🐘','gajah'],['F','Fish','🐟','ikan'],['G','Grapes','🍇','anggur'],['H','Hat','🎩','topi'],['I','Ice cream','🍦','es krim'],['J','Jellyfish','🪼','ubur-ubur'],['K','Kite','🪁','layang-layang'],['L','Lion','🦁','singa'],['M','Moon','🌙','bulan'],['N','Nest','🪺','sarang'],['O','Orange','🍊','jeruk'],['P','Pig','🐷','babi'],['Q','Queen','👑','ratu'],['R','Rabbit','🐰','kelinci'],['S','Sun','☀️','matahari'],['T','Tree','🌳','pohon'],['U','Umbrella','☂️','payung'],['V','Van','🚐','mobil van'],['W','Whale','🐳','paus'],['X','X-ray','🩻','sinar-X'],['Y','Yo-yo','🪀','yoyo'],['Z','Zebra','🦓','zebra']];
const MISSIONS=[['Wake Up, Little Stars!','Star Pond','⭐','Count the stars','Bangunkan tiga bintang.'],['The Rainbow Bridge','Rainbow Bridge','🌉','Match numbers and quantities','Cocokkan banyaknya bintang dengan angka.'],['Cloud Basket','Cloud Basket','☁️','Collect the right number','Kumpulkan bintang sesuai jumlah.'],['The Apple Tree','Apple Tree','🍎','Meet letter A','Kenali huruf A dan apel.'],['Bouncy Ball Hill','Bouncy Hill','🏀','Meet letter B','Kenali huruf B dan bola.'],["Kitty's Cottage",'Kitty Cottage','🐱','Meet letter C','Kenali huruf C dan kucing.']];
const WORLDS=[['Rainbow Meadow','🌈','0–3 · A–C'],['Enchanted Garden','🌷','4–6 · D–G'],['Starry Sky Island','🌟','7–10 · H–L'],['Cloud Castle','🏰','11–14 · M–Q'],['Moonlight Forest','🌙','15–17 · R–V'],['Rainbow Crystal Palace','💎','18–20 · W–Z']];
const MUSIC_TRACKS=['rainbow_meadow_theme.mp3','enchanted_garden_theme.mp3','starry_sky_island_theme.mp3','cloud_castle_theme.mp3','moonlight_forest_theme.mp3','rainbow_crystal_palace_theme.mp3'];
function worldForNumber(n){return n<=3?0:n<=6?1:n<=10?2:n<=14?3:n<=17?4:5;}
function worldForLetter(i){return i<=2?0:i<=6?1:i<=11?2:i<=16?3:i<=21?4:5;}
const KEY='unicorn-magic-world-v1';
let data={done:[],seenNum:[],seenLetter:[],idHelp:true,sound:true,music:true,musicVolume:2};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')data={...data,...s};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const bgm=$('#bgm');
let activeWorld=0;
function chooseWorldMusic(index){
  if(index<0||index>=MUSIC_TRACKS.length||index===activeWorld)return;
  activeWorld=index;
  const wasPlaying=!bgm.paused;
  bgm.pause();bgm.src='./'+MUSIC_TRACKS[index];bgm.load();
  setMusicLevel(voiceIsSpeaking);
  if((wasPlaying||musicActivated)&&data.music)startMusic();
}
let musicActivated=false,voiceSequence=0,voiceIsSpeaking=false;
const volumes={1:.11,2:.18,3:.27};
function setMusicLevel(duck=false){bgm.volume=data.music?(volumes[data.musicVolume]||.18)*(duck?.25:1):0;}
setMusicLevel();
function startMusic(){
 if(!data.music||document.hidden)return;
 musicActivated=true;setMusicLevel(voiceIsSpeaking);
 if(bgm.paused){const promise=bgm.play();if(promise&&promise.catch)promise.catch(()=>{});}
}
function pauseMusic(){bgm.pause();}
function toggleMusic(){data.music=!data.music;save();if(data.music)startMusic();else pauseMusic();render();toast(data.music?'🎵 Music on':'🎵 Music off');}
function musicButton(){return `<button class="round secondary music-button ${data.music?'':'music-off'}" data-act="toggle-music" aria-label="Turn background music ${data.music?'off':'on'}" title="Background music ${data.music?'on':'off'}">${data.music?'🎵':'♪̸'}</button>`;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseMusic();else if(musicActivated)startMusic();});
function seen(type,value){const field=type==='n'?'seenNum':'seenLetter';if(!data[field].includes(value)){data[field].push(value);save()}}
let page='home',mission=-1,phase=0,round=0,picked=new Set(),doneRound=false,nSelected=0,countFree=new Set(),letterSelected=0,quizLetter=false,quizAnswered=false,wrong=0,lastEN='',lastID='',toastTimer=0;
const lulu=`<img class="hero" src="./lulu_happy.png" alt="Lulu the unicorn" draggable="false">`;
function head(name,back='home'){return `<header class="topbar"><div class="group"><button class="round" data-act="go" data-to="${back}" aria-label="Back">‹</button><div class="toplabel">${name}</div></div><div class="group">${musicButton()}<button class="round secondary" data-act="repeat" aria-label="Repeat English audio">🔊</button>${data.idHelp?'<button class="round gold" data-act="help" aria-label="Bantuan bahasa Indonesia" style="font-size:15px">ID</button>':''}</div></header>`}
function banner(text){return `<div class="mini-banner">${text}</div>`}
function setScreen(html){document.getElementById('app').dataset.page=page;root.innerHTML=html;root.scrollTop=0}
function tell(en,id=''){lastEN=en;lastID=id||'Tekan ikon suara untuk mendengarkan lagi.';}
function speak(msg,lang='en-US'){
 if(!data.sound||!('speechSynthesis' in window))return;
 const seq=++voiceSequence;
 voiceIsSpeaking=true;setMusicLevel(true);
 try{
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);
  u.lang=lang;u.rate=lang.startsWith('en')?.80:.93;u.pitch=1.1;u.volume=1;
  const done=()=>{if(seq===voiceSequence){voiceIsSpeaking=false;setMusicLevel(false);}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  // Fallback in case a device never fires speech callbacks.
  setTimeout(done,Math.max(3300,msg.length*110+1300));
 }catch(e){voiceIsSpeaking=false;setMusicLevel(false);}
}
function speakAndRemember(en,id){tell(en,id);speak(en)}
function sound(kind='yes'){if(!data.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC();const notes=kind==='yes'?[523,659,784]:[392];notes.forEach((note,i)=>{const osc=ac.createOscillator(),gain=ac.createGain();osc.connect(gain);gain.connect(ac.destination);osc.type='sine';osc.frequency.value=note;const t=ac.currentTime+i*.09;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.05,t+.016);gain.gain.exponentialRampToValueAtTime(.0001,t+.17);osc.start(t);osc.stop(t+.18)});setTimeout(()=>ac.close().catch(()=>{}),800)}catch(e){}}
function toast(msg){clearTimeout(toastTimer);toastEl.className='toast';toastEl.style.display='block';toastEl.textContent=msg;toastTimer=setTimeout(()=>{toastEl.style.display='none'},2300)}
function good(msg='Great job!'){sound();toast('✨ '+msg);speak(msg)}
function tryAgain(){wrong++;toast(wrong>1?'💜 Look carefully!':'💜 Try again!');speak(wrong>1?'Let me help you.':'Try again!')}
function btn(act,text,cls='pink',attrs=''){return `<button class="btn ${cls}" data-act="${act}" ${attrs}>${text}</button>`}
function go(where){if(where!=='number'&&where!=='letter')chooseWorldMusic(0);page=where;wrong=0;quizLetter=false;render()}
function render(){switch(page){case 'home':home();break;case 'meadow':meadow();break;case 'worlds':worlds();break;case 'missions':missions();break;case 'mission':missionScreen();break;case 'reward':reward();break;case 'free':free();break;case 'numbers':numbers();break;case 'number':numberDetail();break;case 'letters':letters();break;case 'letter':letterDetail();break;case 'collection':collection();break;case 'gate':gate();break;case 'parent':parent();break;default:home()}}
function home(){tell('Hello, little friend! Come play with Lulu!','Halo teman kecil! Yuk bermain bersama Lulu!');setScreen(`<div class="topbar"><span class="pill">✨ Ages 3+</span><div class="group">${musicButton()}<button class="round" data-act="go" data-to="gate" aria-label="Parent Corner">⚙</button></div></div><div class="center"><h1 class="title">🦄 Unicorn<br>Magic World</h1><div class="tagline">ABC • 123 • A magical adventure!</div>${lulu.replace('src="./lulu_happy.png"','src="./lulu_encouraging.png"')}<div class="bottom-actions">${btn('go','▶ Play Adventure','', 'data-to="meadow"')}${btn('go','🎮 Free Play','blue stretch','data-to="free"')}${btn('go','📖 My Collection','purple stretch','data-to="collection"')}</div><p class="footnote">💗 No ads · No account · Learn through play</p></div>`)}
function meadow(){tell('Welcome to Rainbow Meadow! Let’s play!','Selamat datang di Rainbow Meadow! Pilih petualangan atau bermain bebas.');setScreen(head('Rainbow Meadow')+`<div class="meadow-art"><span class="floatlulu">${lulu.replace('class="hero"','class="hero tiny"').replace('src="./lulu_happy.png"','src="./lulu_curious.png"')}</span></div><div class="panel"><h2 class="center">🌈 Hello, little friend!</h2><p class="sub center">The rainbow needs your magic! Help Lulu collect stars and letter gems.</p><div class="spaced">${btn('go','✨ Story Adventure','stretch','data-to="missions"')}${btn('go','🎈 Explore & Free Play','blue stretch','data-to="free"')}${btn('go','🗺️ Explore All Worlds','purple stretch','data-to="worlds"')}</div><p class="caption center" style="margin:15px 0 0">🎵 Each world has its own sing-along theme · Tap 🎵 to turn it on/off<br>English first · Tap 🔊 to listen · Tap ID for help</p></div>`)}
function worlds(){tell('Choose a magical world!','Pilih dunia ajaib. Saat ini Rainbow Meadow sudah bisa dimainkan.');setScreen(head('Choose a World','meadow')+banner('🌈 Six magical worlds')+`<div class="tilegrid">${WORLDS.map((w,i)=>`<div class="world-block"><button class="tile worldtile ${i?'locked':''}" data-act="world" data-world="${i}"><span class="emoji">${w[1]}</span><span class="name">${i+1}. ${w[0]}</span><span class="desc">${w[2]}</span><span class="badge ${i?'':'green'}">${i?'Coming soon':'Play now'}</span></button><button class="world-listen" data-act="preview-theme" data-world="${i}" aria-label="Hear music for ${w[0]}">🎵 Hear theme</button></div>`).join('')}</div><p class="footnote">🎵 Tap Hear theme to listen to each world’s original soundtrack. Story Worlds 2–6 are still coming soon; their numbers and letters can already be explored in Free Play.</p>`)}
function missions(){tell('Choose a little adventure!','Pilih salah satu dari enam misi. Semua misi dapat dimainkan ulang.');setScreen(head('Story Adventure','meadow')+banner(`⭐ Rainbow Meadow · ${data.done.length}/6 rewards`)+`<div class="tilegrid">${MISSIONS.map((m,i)=>`<button class="tile ${data.done.includes(i)?'done':''}" data-act="mission" data-n="${i}"><span class="emoji">${m[2]}</span><span class="name">${i+1}. ${m[1]}</span><span class="desc">${m[3]}</span>${data.done.includes(i)?'<span class="badge green">✓ Completed</span>':'<span class="badge">Play ▶</span>'}</button>`).join('')}</div><p class="footnote">✨ Any adventure can be replayed. There is no time limit or game over.</p>`)}
function missionStart(i){mission=i;phase=0;round=0;picked=new Set();doneRound=false;wrong=0;page='mission';missionScreen();const intro=['Let’s wake up three little stars!','Help Lulu build a rainbow bridge!','Let’s fill the cloud basket!','A is for Apple.','B is for Ball.','C is for Cat.'][i];tell(intro,MISSIONS[i][4]);speak(intro)}

function missionScreen(){let html=missionTop();switch(mission){case 0:{const c=picked.size;html+=workHint('Tap the stars to wake them up!','Sentuh tiga bintang satu per satu untuk membangunkannya.');html+=`<div class="object-area">${[0,1,2].map(i=>`<button class="starbtn ${picked.has(i)?'lit':''}" data-act="wake" data-n="${i}" ${picked.has(i)?'disabled':''} aria-label="Star ${i+1}">${picked.has(i)?'✨':'⭐'}</button>`).join('')}</div><div class="center sub">${c} / 3 stars awake</div>`;break}
case 1:{const tgt=[2,1,3][round];html+=workHint(`How many stars? Find number ${WORDS[tgt]}!`,`Hitung bintangnya. Pilih angka ${WORD_ID[tgt]}.`);html+=`<div class="object-area" style="font-size:48px">${Array(tgt).fill('⭐').join(' ')}</div>`;html+=doneRound?`<div class="flash">✨ Yes! ${WORDS[tgt]} stars!</div>${btn('next-round','Next ➜','green stretch')}`:`<div class="choicegrid">${[1,2,3].map(n=>`<button class="number" data-act="choose-count" data-n="${n}">${n}</button>`).join('')}</div>`;html+=`<div class="progressdots">${[0,1,2].map(i=>`<span class="${i<=round?'done':''}"></span>`).join('')}</div>`;break}
case 2:{const tgt=[1,2,3][round];html+=workHint(`Put ${WORDS[tgt]} ${tgt===1?'star':'stars'} in the basket!`,`Sentuh dan masukkan ${WORD_ID[tgt]} bintang ke keranjang.`);html+=`<div class="object-area" style="flex-direction:column"><div style="font-size:54px">🧺 <span style="font-size:23px;color:#7349a9">${picked.size} / ${tgt}</span></div><div class="row wrap" style="justify-content:center">${[0,1,2,3].map(i=>`<button class="starbtn ${picked.has(i)?'lit':''}" data-act="basket" data-n="${i}" ${picked.has(i)||doneRound?'disabled':''} aria-label="Collect star">${picked.has(i)?'✨':'⭐'}</button>`).join('')}</div></div>`;html+=doneRound?`<div class="flash">✨ ${WORDS[tgt]}! Thank you!</div>${btn('next-round','Next ➜','green stretch')}`:`<div class="hint">Tap each star once.</div>`;break}
case 3:{const steps=[['Tap letter A!','Sentuh huruf A!'],['Tap the apple!','Sentuh buah apel!'],['Find letter A!','Pilih huruf A!']];html+=workHint(steps[phase][0],steps[phase][1]);html+=phase===0?`<div class="object-area"><button class="letter" style="width:150px" data-act="apple-step">A</button></div>`:phase===1?`<div class="object-area"><button class="starbtn" style="font-size:85px;width:160px;height:145px" data-act="apple-step">🍎</button></div>`:`<div class="choicegrid">${['B','A','C'].map(x=>`<button class="letter" data-act="apple-find" data-letter="${x}">${x}</button>`).join('')}</div>`;break}
case 4:{const steps=[['Tap the bouncing balls!','Sentuh dua bola yang memantul.'],['Find letter B!','Pilih huruf B!']];html+=workHint(steps[phase][0],steps[phase][1]);html+=phase===0?`<div class="object-area"><button class="starbtn" style="font-size:80px;width:150px;height:142px" data-act="bounce">⚽</button></div><div class="center sub">${picked.size} / 2 taps</div>`:`<div class="choicegrid">${['A','C','B'].map(x=>`<button class="letter" data-act="ball-find" data-letter="${x}">${x}</button>`).join('')}</div>`;break}
case 5:{const values=[['C','🐱','Cat'],['A','🍎','Apple'],['B','⚽','Ball']];const [target,emoji,name]=values[round];html+=workHint(`Find the letter for ${name}!`,`Huruf apa yang cocok untuk ${name.toLowerCase()}?`);html+=`<div class="object-area"><div class="large-item">${emoji}</div><div class="center sub">${name}</div></div>`;html+=doneRound?`<div class="flash">✨ ${target} is for ${name}!</div>${btn('next-round','Next ➜','green stretch')}`:`<div class="choicegrid">${['A','B','C'].map(x=>`<button class="letter" data-act="cat-find" data-letter="${x}">${x}</button>`).join('')}</div>`;break}}
html+=`<div class="row" style="justify-content:center;margin-top:16px">${btn('repeat','🔊 Listen','cream sm')}${data.idHelp?btn('help','🇮🇩 Bantuan','cream sm'):''}</div>`;setScreen(html)}
function finishMission(){const was=data.done.includes(mission);if(!was){data.done.push(mission);data.done.sort((a,b)=>a-b);save()}page='reward';sound();speak('Wonderful! You helped Lulu!');reward()}
function reward(){const item=mission<3?'⭐':'💎',last=mission===5;setScreen(head('Magic Reward','missions')+`<div class="panel center" style="margin-top:30px"><div class="win-hero">${last&&data.done.length===6?'🌈':item}</div><h2 style="font-size:28px">${last&&data.done.length===6?'Rainbow Magic!':'Wonderful!'}</h2><p class="sub">${last&&data.done.length===6?'You helped the whole rainbow shine again!':'You helped Lulu and earned a magical reward!'}</p><div class="row" style="justify-content:center">${lulu.replace('class="hero"','class="hero small"').replace('src="./lulu_happy.png"','src="./lulu_celebrating.png"')}</div><div class="spaced">${mission<5?btn('next-mission','Next Adventure ➜','stretch'):btn('go','🌈 Rainbow Meadow','stretch','data-to="meadow"')}${btn('go','📖 Magic Collection','purple stretch','data-to="collection"')}${btn('go','Replay Adventures','blue stretch','data-to="missions"')}</div></div>`)}
function free(){tell('What shall we learn today? Numbers or letters?','Mau belajar angka atau huruf? Pilih salah satu.');setScreen(head('Free Play','meadow')+banner('🎈 Explore at your own pace')+`<div class="meadow-art"><span class="floatlulu">${lulu.replace('class="hero"','class="hero tiny"').replace('src="./lulu_happy.png"','src="./lulu_curious.png"')}</span></div><div class="tilegrid" style="margin-top:16px"><button class="tile" data-act="go" data-to="numbers" style="min-height:170px"><span class="emoji">🔢</span><span class="name" style="font-size:21px">Magic Numbers</span><span class="desc">0–20 • Tap & count</span></button><button class="tile" data-act="go" data-to="letters" style="min-height:170px"><span class="emoji">🔤</span><span class="name" style="font-size:21px">Magic Alphabet</span><span class="desc">A–Z • Letters & words</span></button></div><p class="footnote">Everything is available. There are no locked lessons here.</p>`)}
function numbers(){tell('Choose any number, from zero to twenty!','Pilih angka mana pun dari nol sampai dua puluh.');setScreen(head('Magic Numbers','free')+banner('🔢 Pick a number!')+`<div class="panel"><div class="number-grid">${WORDS.map((_,i)=>`<button class="number" data-act="pick-number" data-n="${i}" aria-label="Number ${WORDS[i]}">${i}</button>`).join('')}</div></div><p class="footnote">✨ ${data.seenNum.length}/21 numbers explored • Count stars together!</p>`)}
function numberDetail(){const n=nSelected;seen('n',n);tell(n===0?'Zero! The basket is empty!':`This is number ${WORDS[n]}. Let's count ${n===1?'one star':n+' stars'}!`,n===0?'Nol artinya tidak ada benda di keranjang.':`Ini angka ${WORD_ID[n]}. Yuk hitung ${WORD_ID[n]} bintang!`);setScreen(head(`Number ${n}`,'numbers')+`<div class="panel center">${banner('✨ '+WORDS[n].toUpperCase())}<div class="bigletter" style="font-size:100px">${n}</div><div class="music-world-hint">🎵 ${WORLDS[worldForNumber(n)][0]} theme</div><div class="sub">${n===0?'Zero stars — an empty basket!':'Tap each star to count them.'}</div><div class="object-area" style="min-height:160px">${n===0?'<div style="font-size:85px">🧺</div>':`<div class="counter-grid">${Array.from({length:n},(_,i)=>`<button class="counter-dot ${countFree.has(i)?'found':''}" data-act="tap-count" data-n="${i}" aria-label="Star ${i+1}">${countFree.has(i)?'✨':'⭐'}</button>`).join('')}</div>`}</div><p class="sub">${n===0?'0 stars':countFree.size+' / '+n+' stars counted'}</p>${btn('repeat','🔊 Hear the number','blue stretch')}${data.idHelp?btn('help','🇮🇩 Bantuan','cream stretch'):''}</div>`)}
function letters(){tell('Choose a letter from A to Z!','Pilih huruf A sampai Z.');setScreen(head('Magic Alphabet','free')+banner('🔤 Choose a letter!')+`<div class="panel"><div class="letter-grid">${ALPHA.map(([l],i)=>`<button class="letter" data-act="pick-letter" data-n="${i}" aria-label="Letter ${l}">${l}</button>`).join('')}</div></div><p class="footnote">🌈 ${data.seenLetter.length}/26 letters explored • Listen, look and play!</p>`)}
function letterDetail(){const [l,w,emoji,indo]=ALPHA[letterSelected];seen('a',l);tell(`Letter ${l}. ${l} is for ${w}!`,`Ini huruf ${l}. ${w} artinya ${indo}.`);const index=letterSelected, options=[ALPHA[(index+1)%26][0],l,ALPHA[(index+3)%26][0]];setScreen(head(`Letter ${l}`,'letters')+`<div class="panel center"><div class="eyebrow">MAGIC ALPHABET</div><div class="bigletter">${l}</div><div class="music-world-hint">🎵 ${WORLDS[worldForLetter(letterSelected)][0]} theme</div><div class="object-area" style="flex-direction:column;gap:3px"><button style="font-size:85px;background:none;border:0" data-act="word-speak" aria-label="Hear ${w}">${emoji}</button><h2 style="font-size:28px">${w}</h2><p class="sub" style="margin:0">${l} is for ${w}!</p></div>${quizLetter?`<div class="prompt">Find the letter ${l}!</div><div class="choicegrid">${options.map(x=>`<button class="letter" data-act="quiz-letter" data-letter="${x}">${x}</button>`).join('')}</div>${quizAnswered?'<div class="flash">✨ Great job!</div>':''}`:btn('start-letter-quiz','✨ Find the letter!','stretch')}<div class="gap"></div>${btn('word-speak','🔊 Hear the word','blue stretch')}${data.idHelp?btn('help','🇮🇩 Bantuan','cream stretch'):''}</div>`)}
function collection(){const total=data.done.length;const stickers=MISSIONS.map((m,i)=>`${data.done.includes(i)?`<div class="sticker"><div>${i<3?'⭐':'💎'}</div><span class="smalltext">${m[1]}</span></div>`:`<div class="sticker dim"><div>✨</div><span class="smalltext">Not yet</span></div>`}`).join('');tell('Look at your magic collection!','Lihat koleksi hadiah dari petualanganmu.');setScreen(head('My Collection','home')+banner('📖 Lulu’s Magic Collection')+`<div class="panel"><h2 class="center">${total} / 6 Magic Treasures</h2><div class="progressline"><div style="width:${total/6*100}%"></div></div><div class="gap"></div><div class="collection">${stickers}</div><p class="sub center" style="margin-bottom:0">${total===6?'🌈 The rainbow shines again!':'Play adventures to collect magical stars and gems.'}</p></div><div class="gap"></div><div class="panel"><h3>🔢 Numbers explored: ${data.seenNum.length}/21</h3><div class="progressline"><div style="width:${data.seenNum.length/21*100}%"></div></div><div class="gap"></div><h3>🔤 Letters explored: ${data.seenLetter.length}/26</h3><div class="progressline"><div style="width:${data.seenLetter.length/26*100}%"></div></div><p class="caption">Explored means opened or played; it does not mean mastered.</p></div><div class="gap"></div>${btn('go','🎮 Let’s Play!','stretch','data-to="free"')}`)}

function nextRound(){doneRound=false;round++;picked=new Set();wrong=0;if(round>=3)finishMission();else{missionScreen();const t=mission===1?WORDS[[2,1,3][round]]:mission===2?WORDS[[1,2,3][round]]:['Cat','Apple','Ball'][round];speak(`Let's try ${t}!`)}}
function handle(el){const a=el.dataset.act;if(!a)return;switch(a){case 'toggle-music':toggleMusic();break;case 'music-volume':data.musicVolume=+el.dataset.n;save();setMusicLevel(voiceIsSpeaking);if(data.music)startMusic();parent();toast('🎵 Music volume updated');break;case 'go':go(el.dataset.to);if(page==='meadow')speak(lastEN);break;case 'repeat':speak(lastEN);if(!('speechSynthesis' in window))toast('Speech may not be available on this browser.');break;case 'help':if(data.idHelp){toast('🇮🇩 '+lastID);speak(lastID,'id-ID')}break;case 'world':if(+el.dataset.world===0)go('missions');else toast('🌟 This adventure is coming soon. Tap 🎵 Hear theme to listen!');break;case 'preview-theme':{const w=+el.dataset.world;if(!data.music){toast('🎵 Turn on music to hear the theme.');break;}chooseWorldMusic(w);startMusic();toast('🎵 '+WORLDS[w][0]+' theme');break;}case 'mission':missionStart(+el.dataset.n);break;case 'wake':{const i=+el.dataset.n;if(picked.has(i))return;picked.add(i);seen('n',picked.size);sound();speak(WORDS[picked.size]);if(picked.size===3){setTimeout(finishMission,700)}else missionScreen();break}
case 'choose-count':{const tgt=[2,1,3][round];if(+el.dataset.n===tgt){seen('n',tgt);doneRound=true;good(`${WORDS[tgt]} stars!`);missionScreen()}else tryAgain();break}
case 'basket':{if(doneRound)return;const i=+el.dataset.n;if(picked.has(i))return;picked.add(i);seen('n',picked.size);sound();speak(WORDS[picked.size]);if(picked.size===[1,2,3][round]){doneRound=true;setTimeout(()=>{missionScreen();speak('Great job!')},450)}else missionScreen();break}
case 'next-round':nextRound();break;case 'apple-step':phase++;if(phase>=2)phase=2;missionScreen();speak(phase===1?'Apple!':'Find letter A!');break;case 'apple-find':if(el.dataset.letter==='A'){seen('a','A');finishMission()}else tryAgain();break;
case 'bounce':picked.add(picked.size);sound();speak('Ball!');if(picked.size>=2){phase=1;missionScreen()}else missionScreen();break;case 'ball-find':if(el.dataset.letter==='B'){seen('a','B');finishMission()}else tryAgain();break;case 'cat-find':{const ans=['C','A','B'][round];if(el.dataset.letter===ans){seen('a',ans);doneRound=true;good(`${ans} is for ${['Cat','Apple','Ball'][round]}!`);missionScreen()}else tryAgain();break}
case 'next-mission':missionStart(Math.min(mission+1,5));break;case 'pick-number':nSelected=+el.dataset.n;countFree=new Set();chooseWorldMusic(worldForNumber(nSelected));go('number');speak(lastEN);break;case 'tap-count':{const i=+el.dataset.n;if(countFree.has(i))return;countFree.add(i);sound();speak(WORDS[countFree.size]);numberDetail();if(countFree.size===nSelected&&nSelected!==0){toast('✨ You counted '+WORDS[nSelected]+' stars!')}break}
case 'pick-letter':letterSelected=+el.dataset.n;quizLetter=false;quizAnswered=false;chooseWorldMusic(worldForLetter(letterSelected));go('letter');speak(lastEN);break;case 'start-letter-quiz':quizLetter=true;quizAnswered=false;letterDetail();speak(`Find the letter ${ALPHA[letterSelected][0]}!`);break;case 'quiz-letter':if(el.dataset.letter===ALPHA[letterSelected][0]){quizAnswered=true;good('Great job!');letterDetail()}else tryAgain();break;case 'word-speak':{const [l,w]=ALPHA[letterSelected];speak(`${l} is for ${w}!`);break}
case 'parent-answer':if(+el.dataset.n===7)go('parent');else toast('Ask a grown-up to help.');break;case 'toggle-id':data.idHelp=!data.idHelp;save();parent();break;case 'toggle-sound':data.sound=!data.sound;if(!data.sound){voiceIsSpeaking=false;voiceSequence++;try{speechSynthesis.cancel()}catch(e){}setMusicLevel(false);}save();parent();break;case 'confirm-reset':if(window.confirm('Reset all locally saved game progress?')){data.done=[];data.seenNum=[];data.seenLetter=[];save();parent();toast('Progress reset.')}break;default:break}}
root.addEventListener('click',ev=>{const el=ev.target.closest('button[data-act]');if(el){if(!['toggle-music','preview-theme'].includes(el.dataset.act))startMusic();handle(el);}});
window.addEventListener('pagehide',()=>{save();pauseMusic();try{speechSynthesis.cancel()}catch(e){}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
