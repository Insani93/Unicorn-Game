-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;align-items:center;justify-items:center}.counter-dot{min-width:42px;min-height:42px;font-size:32px;border:2px solid white;border-radius:15px;background:#fff1ba;box-shadow:0 3px 0 #eab56c}.counter-dot.found{background:#d5f7ca;box-shadow:0 3px 0 #a1d1a4}.large-item{font-size:96px;text-align:center;line-height:1.2}.bigletter{font-size:116px;color:#f45ca8;text-shadow:0 6px 0 #b664c5,0 9px 14px #9b6dd55e;text-align:center;font-weight:1000;line-height:1.1}.flash{border:3px solid #fff;background:linear-gradient(#eaffde,#f8ffea);border-radius:22px;padding:16px;text-align:center;color:#417c51;font-size:19px;font-weight:1000;margin:12px 0}.toast{position:absolute;z-index:30;left:20px;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));background:#fffdf9;box-shadow:0 8px 20px #573b7e7d;border:3px solid #ebc4ff;color:#673a9a;border-radius:20px;padding:12px;text-align:center;font-weight:900;animation:pop .24s ease-out}.progressline{height:12px;background:#e9dcff;border-radius:99px;overflow:hidden}.progressline>div{background:linear-gradient(90deg,#a5e68d,#5ac783);height:100%;border-radius:99px;transition:width .2s}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sticker{background:#fff8fd;border:3px solid #ead6fc;border-radius:17px;text-align:center;padding:12px 5px;font-size:36px}.sticker.dim{filter:grayscale(1);opacity:.25}.smalltext{font-size:12px;display:block;color:#70518c;font-weight:900}.parent-option{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid #e2c3f7;border-radius:14px;padding:13px;color:#5f3b9b;margin:9px 0;font-weight:900;text-align:left}.switch{width:46px;height:26px;border-radius:99px;background:#b8a3d1;position:relative;flex-shrink:0}.switch.on{background:#7dd4aa}.switch:after{content:"";position:absolute;top:4px;left:4px;background:white;width:18px;height:18px;border-radius:50%;transition:.2s}.switch.o /* Visual Style Guide v1.0 alignment — original Rainbow Meadow backdrop and Lulu sprites. */
#app[data-page="home"] .sky{background:linear-gradient(180deg,#91ceff18 0%,#bcdeff00 30%,#ffe6f28c 97%),url('./meadow.webp') center bottom / auto 62% no-repeat;}
#app[data-page="home"] .sky .hill,#app[data-page="home"] .sky .flowerline,#app[data-page="home"] .sky .sun{display:none}
#app[data-page="home"] .content{background:linear-gradient(180deg,#ebd4ff22 0%,#fff7ff11 55%,#fff1f3aa 95%)}
#app[data-page="home"] .hero{width:min(74%,270px);max-height:34vh;object-fit:contain;animation:float 3.8s ease-in-out infinite alternate}
#app[data-page="home"] .title{margin:3px auto 6px;line-height:1.0;font-size:clamp(31px,8.5vw,43px)}
#app[data-page="home"] .tagline{font-size:13px;padding:6px 12px}
#app[data-page="home"] .bottom-actions{max-width:290px;margin:0 auto;gap:8px}
#app[data-page="home"] .btn{min-height:52px}
#app[data-page="home"] .footnote{background:#fff9ffb8;border-radius:20px;padding:5px 10px;display:inline-block}
.hero{height:auto;display:block;object-fit:contain;user-select:none}
.meadow-art .floatlulu{width:135px;right:5%;bottom:-3px}
.meadow-art .floatlulu .hero{max-width:100%;width:100%}
#app[data-page="reward"] .hero.small{max-width:220px;width:min(62%,220px)}
@media(max-height:700px){#app[data-page="home"] .hero{max-height:29vh}#app[data-page="home"] .bottom-actions{gap:6px}#app[data-page="home"] .btn{min-height:45px}}

.world-block{min-width:0;display:flex;flex-direction:column;gap:6px}
.world-block .worldtile{width:100%;flex:1;min-height:155px}
.world-listen{border:2px solid white;border-radius:16px;color:#663a92;background:linear-gradient(#fff8ff,#e8dcff);box-shadow:0 3px 0 #bca3db;font-size:13px;font-weight:900;min-height:42px;padding:7px}
.music-world-hint{color:#8c54a7;text-align:center;font-size:12px;font-weight:800;margin:3px 0 7px}
.voice-settings{border-radius:20px;border:2px solid #e7d0ff;background:#fffafb;padding:12px;margin-top:13px}.voice-settings h3{margin:6px 0;font-size:18px}.voice-settings p{font-size:13px;color:#6d5190;line-height:1.45}.voice-picker{display:block;width:100%;margin:6px 0 10px;border-radius:14px;border:2px solid #d7b7fa;background:#fff;padding:11px 8px;font:700 14px system-ui;color:#563588}.voice-actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.voice-actions button{border:2px solid #e4c9fa;border-radius:15px;background:#f4eaff;color:#653399;padding:10px;font-weight:800;min-height:42px;flex:1}.voice-actions button.active{background:#d8c2ff;border-color:#aa7fe0}.voice-info{font-size:12px!important}.voice-profile-label{display:block;font-weight:900;margin-top:12px}

/* v6 — Interactive Touch Learning */
.number,.letter,.interactive-glyph{transition:transform .19s ease,background .19s ease,box-shadow .19s ease,color .19s ease;will-change:transform}
.tap-selected,.number.tap-selected,.letter.tap-selected,.interactive-glyph.tap-selected{transform:translateY(-5px) scale(1.13)!important;background:linear-gradient(155deg,#ffe990,#ff9cda)!important;color:#a62981!important;box-shadow:0 0 0 5px #fff9,0 13px 28px #f583b389,0 5px 0 #ce68ac!important;position:relative;z-index:4}

.world-0{background:linear-gradient(135deg,#82d6fe,#b4edbd,#f3baff)}
.world-1{background:linear-gradient(135deg,#80dfbb,#a8e883,#fbc6df)}
.world-2{background:linear-gradient(135deg,#5a9fe7,#9bb0ff,#d6a7fc)}
.world-3{background:linear-gradient(135deg,#8cacff,#d8c0fd,#ffdbcf)}
.world-4{background:linear-gradient(135deg,#475aab,#8a81d5,#b7c8f3)}
.world-5{background:linear-gradient(135deg,#7b8fee,#c691e9,#ffca96)}
.mission-info{padding:10px 13px;background:#ffffffe0;border-radius:16px;color:#6e4f96;line-height:1.35;font-size:14px;font-weight:800;text-align:center;margin:10px 0}

@media(max-width:360px){.count-bunch button{width:38px;height:38px;min-width:38px}.world-scene img{width:75px}.world-scene .world-copy strong{font-size:17px}}

/* v6.1: synchronized Tap-Pop-Speak animations. Speech and motion are deliberately gentle. */
@keyframes letterBreathe {0%,100%{transform:translateY(-4px) scale(1.07)}50%{transform:translateY(-10px) scale(1.15)}}

function letters(){tell('Choose a letter from A to Z!','Pilih huruf A sampai Z.');setScreen(head('Magic Alphabet','free')+banner('🔤 Choose a letter!')+`<div class="panel"><div class="letter-grid">${ALPHA.map(([l],i)=>`<button class="letter" data-act="pick-letter" data-n="${i}" aria-label="Letter ${l}">${l}</button>`).join('')}</div></div><p class="footnote">🌈 ${data.seenLetter.length}/26 letters explored • Listen, look and play!</p>`)}
function letterDetail(){const [l,w,emoji,indo]=ALPHA[letterSelected];seen('a',l);tell(`${l}. ${l}. ${w}!`,`Ini huruf ${l}. ${w} artinya ${indo}.`);const index=letterSelected, options=[ALPHA[(index+1)%26][0],l,ALPHA[(index+3)%26][0]];setScreen(head(`Letter ${l}`,'letters')+`<div class="panel center"><div class="eyebrow">MAGIC ALPHABET</div><div class="alphabet-stage"><button class="bigletter interactive-glyph" data-act="tap-letter" data-lesson-focus="1" aria-label="Hear ${l}"><span class="glyph-symbol">${l}</span><span class="glyph-caption">👆 Tap & listen</span></button><button id="lesson-object" class="lesson-object stage-word is-hidden" data-act="tap-letter" aria-label="Repeat learning ${l}">${itemArt(l)}<span class="objword">${w}</span></button></div><div class="music-world-hint">🎵 ${WORLDS[worldForLetter(letterSelected)][0]} theme</div><div id="lesson-status" class="lesson-status">Tap to hear the letter, then see ${w}.</div>${quizLetter?`<div class="prompt">Find the letter ${l}!</div><div class="choicegrid">${options.map(x=>`<button class="letter" data-act="quiz-letter" data-letter="${x}">${x}</button>`).join('')}</div>${quizAnswered?`<div class="flash">✨ ${POSITIVE_PHRASES[lastPositive]||'Well done!'}</div>`:''}`:btn('start-letter-quiz','✨ Find the letter!','stretch')}<div class="gap"></div>${btn('word-speak','🔊 Hear the word','blue stretch')}${data.idHelp?btn('help','🇮🇩 Bantuan','cream stretch'):''}</div>`)}
function collection(){const total=data.done.length;const all=STORY_MISSIONS.length;tell('Look at your magic collection!','Lihat koleksi hadiah dari petualanganmu.');setScreen(head('My Collection','home')+banner('📖 Lulu’s Magic Collection')+`<div class="panel"><h2 class="center">${total} / ${all} Magic Adventures</h2><div class="progressline"><div style="width:${total/all*100}%"></div></div><div class="tilegrid" style="margin-top:18px">${WORLDS.map((w,i)=>{const ids=missionsForWorld(i),done=ids.filter(j=>data.done.includes(j)).length;return `<button class="tile" data-act="world" data-world="${i}"><span class="emoji">${w[1]}</span><span class="name">${w[0]}</span><span class="desc">${done}/${ids.length} adventures completed</span></button>`}).join('')}</div><p class="sub center">Every completed mission earns a star or gem. All missions can be replayed.</p></div><div class="gap"></div><div class="panel"><h3>🔢 Numbers explored: ${data.seenNum.length}/21</h3><div class="progressline"><div style="width:${data.seenNum.length/21*100}%"></div></div><div class="gap"></div><h3>🔤 Letters explored: ${data.seenLetter.length}/26</h3><div class="progressline"><div style="width:${data.seenLetter.length/26*100}%"></div></div><p class="caption">Explored means opened or played; it does not mean mastered. Your previous progress is kept.</p></div><div class="gap"></div>${btn('go','🎮 Let’s Play!','stretch','data-to="free"')}`)}

ach utterance, then says the object's name.</p>${voicePicker('lulu','🦄 Lulu — choose a female-sounding voice')}${voicePicker('narrator','📖 Narrator — choose a male-sounding voice')}<div class="voice-actions"><button data-act="voice-refresh">↻ Refresh voices</button></div><p class="voice-info">${englishVoices().length} English voice(s) detected. If zero, Chrome uses its default. On iPad Safari, voice options may differ and some need downloaded language voices. Tap Test to listen.</p><p class="sub">Narration speed:</p><div class="voice-actions">${[['0.88','Gentle'],['0.94','Natural'],['1.02','Lively']].map(([rate,name])=>`<button class="${data.voiceRate===rate?'active':''}" data-act="voice-rate" data-rate="${rate}">${name}</button>`).join('')}</div></div><div class="gap"></div><h2>📊 Learning Journey</h2><p class="sub">${data.done.length}/${STORY_MISSIONS.length} adventures completed<br>${data.seenNum.length}/21 numbers explored<br>${data.seenLetter.length}/26 letters explored</p><div class="gap"></div>${btn('confirm-reset','🗑 Reset local progress','cream stretch')}<p class="caption">Only data in this browser is stored. No account, ads or analytics. Clearing browser storage also clears progress.</p></div>`)}
function nextRound(){doneRound=false;round++;picked=new Set();wrong=0;if(round>=3)finishMission();else{missionScreen();const t=mission===1?WORDS[[2,1,3][round]]:mission===2?WORDS[[1,2,3][round]]:['Cat','Apple','Ball'][round];speak(`Let's try ${t}!`)}}
function handle(el){const a=el.dataset.act;if(!a)return;switch(a){case 'audio-preview':{if(appleAudioDevice&&!ipadVoiceReady){document.getElementById('audio-start').hidden=false;break;}speak('Hello, little friend!');break;}case 'toggle-music':toggleMusic();break;case 'music-volume':data.musicVolume=+el.dataset.n;save();setMusicLevel(voiceIsSpeaking);if(data.music)startMusic();parent();toast('🎵 Music volume updated');break;case 'go':go(el.dataset.to);if(page==='meadow')speak(lastEN);break;case 'repeat':if(page==='letter')touchLesson('letter',ALPHA[letterSelected][0]);else if(page==='number')touchLesson('number',nSelected);else speak(lastEN);if(!('speechSynthesis' in window))toast('Speech may not be available on this browser.');break;case 'help':if(data.idHelp){toast('🇮🇩 '+lastID);speak(lastID,'id-ID')}break;case 'world':chosenWorld=+el.dataset.world;chooseWorldMusic(chosenWorld);go('missions');break;case 'preview-theme':{const w=+el.dataset.world;if(!data.music){toast('🎵 Turn on music to hear the theme.');break;}chooseWorldMusic(w);startMusic();toast('🎵 '+WORLDS[w][0]+' theme');break;}case 'mission':missionStart(+el.dataset.n);break;case 'wake':{const i=+el.dataset.n;if(picked.has(i))return;picked.add(i);seen('n',picked.size);sound();missionScreen();showCountingFeedback(picked.size);if(picked.size===3){speak(WORDS[picked.size],'en-US','',()=>{if(page==='mission'&&mission===0)finishMission();});}else speak(WORDS[picked.size]);break}
case 'choose-count':{const tgt=[2,1,3][round];if(+el.dataset.n===tgt){seen('n',tgt);doneRound=true;good(`${WORDS[tgt]} stars!`);missionScreen()}else tryAgain();break}
case 'basket':{if(doneRound)return;const i=+el.dataset.n;if(picked.has(i))return;picked.add(i);seen('n',picked.size);sound();const complete=picked.size===[1,2,3][round];if(complete)doneRound=true;missionScreen();showCountingFeedback(picked.size);speak(WORDS[picked.size],'en-US','',()=>{if(complete&&page==='mission'&&mission===2)good(`${WORDS[picked.size]} stars!`);});break}
case 'next-round':nextRound();break;case 'apple-step':{const old=phase;tapGlow(el);if(old===0)touchLesson('letter','A',()=>{if(page==='mission'&&mission===3){phase=1;missionScreen()}});else{speak('Apple');setTimeout(()=>{if(page==='mission'&&mission===3){phase=2;missionScreen()}},950)}break;}case 'apple-find':{tapGlow(el);if(el.dataset.letter==='A'){seen('a','A');setTimeout(()=>{if(page==='mission'&&mission===3)finishMission()},260)}else tryAgain();break;}
case 'bounce':picked.add(picked.size);sound();speak('Ball!');if(picked.size>=2){phase=1;missionScreen()}else missionScreen();break;case 'ball-find':{tapGlow(el);if(el.dataset.letter==='B'){seen('a','B');setTimeout(()=>{if(page==='mission'&&mission===4)finishMission()},260)}else tryAgain();break;}case 'cat-find':{tapGlow(el);const ans=['C','A','B'][round];if(el.dataset.letter===ans){seen('a',ans);doneRound=true;missionScreen();good(`${ans} is for ${['Cat','Apple','Ball'][round]}!`)}else setTimeout(tryAgain,650);break}
case 'next-mission':{const next=nextStoryMission(mission);if(next>=0)missionStart(next);else go('worlds');break;}case 'pick-number':delayedSelection(el,()=>{nSelected=+el.dataset.n;countFree=new Set();chooseWorldMusic(worldForNumber(nSelected));go('number');touchLesson('number',nSelected);},WORDS[+el.dataset.n]);break;case 'tap-number':touchLesson('number',nSelected);break;case 'tap-count':{const i=+el.dataset.n;if(countFree.has(i))return;countFree.add(i);sound();const count=countFree.size;numberDetail();showCountingFeedback(count);speak(WORDS[count],'en-US','',()=>{if(count===nSelected&&nSelected!==0&&page==='number')good(`You counted ${WORDS[nSelected]} stars!`);});break}
case 'pick-letter':{const i=+el.dataset.n;delayedSelection(el,()=>{letterSelected=i;quizLetter=false;quizAnswered=false;chooseWorldMusic(worldForLetter(i));go('letter');touchLesson('letter',ALPHA[i][0]);},ALPHA[i][0]);break;}case 'tap-letter':touchLesson('letter',ALPHA[letterSelected][0]);break;case 'start-letter-quiz':quizLetter=true;quizAnswered=false;letterDetail();speak(`Find the letter ${ALPHA[letterSelected][0]}!`);break;case 'quiz-letter':{tapGlow(el);if(el.dataset.letter===ALPHA[letterSelected][0]){if(!quizAnswered){quizAnswered=true;good();letterDetail();}}else if(!quizAnswered)tryAgain();break;}case 'word-speak':{tapGlow(el);const [l,w]=ALPHA[letterSelected];const obj=root.querySelector('#lesson-object');if(obj){obj.classList.remove('reveal','is-hidden');void obj.offsetWidth;obj.classList.add('reveal');root.querySelector('.alphabet-stage')?.classList.add('word-stage')}speak(w);break}

case 'voice-activate':data.voiceProfile=el.dataset.role;save();parent();toast('Voice changed. Press Test to listen!');break;
case 'voice-rate':data.voiceRate=el.dataset.rate;save();parent();toast('Narration speed changed');break;
case 'voice-refresh':parent();toast('Checked available voices');break;
case 'parent-answer':if(+el.dataset.n===7)go('parent');else toast('Ask a grown-up to help.');break;case 'toggle-id':data.idHelp=!data.idHelp;save();parent();break;case 'toggle-sound':data.sound=!data.sound;if(!data.sound){stopOfflineVoice();cancelTouchLesson();voiceIsSpeaking=false;voiceSequence++;try{speechSynthesis.cancel()}catch(e){}setMusicLevel(false);}save();parent();break;case 'confirm-reset':if(window.confirm('Reset all locally saved game progress?')){data.done=[];data.seenNum=[];data.seenLetter=[];save();parent();toast('Progress reset.')}break;default:break}}
root.addEventListener('change',ev=>{const el=ev.target.closest('select[data-voice-select]');if(!el)return;
 const role=el.dataset.voiceSelect;
 if(role==='lulu')data.voiceLulu=el.value;
 else if(role==='narrator')data.voiceNarrator=el.value;
 save();toast('Voice saved. Tap Test to listen.');
});
if('speechSynthesis' in window){try{speechSynthesis.addEventListener('voiceschanged',()=>{if(page==='parent')parent()});}catch(e){}}
root.addEventListener('click',ev=>{const el=ev.target.closest('button[data-act]');if(el){if(appleAudioDevice&&!ipadVoiceReady){document.getElementById('audio-start').hidden=false;return;}if(!['toggle-music','preview-theme'].includes(el.dataset.act))startMusic();handle(el);}});
window.addEventListener('pagehide',()=>{stopOfflineVoice();cancelTouchLesson();save();pauseMusic();try{speechSynthesis.cancel()}catch(e){}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
